version: '3.8'

services:
  network-monitor:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: network-monitor
    restart: unless-stopped
    volumes:
      - network-monitor-data:/app/data
      - network-monitor-logs:/var/log/network-monitor
      - ./config.json:/app/config.json:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - monitor-network
    healthcheck:
      test: ["CMD", "python", "health_check.py"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  network-monitor-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: network-monitor-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - network-monitor-data:/app/data
      - network-monitor-logs:/var/log/network-monitor
      - ./config.json:/app/config.json:ro
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8080
    networks:
      - monitor-network
    depends_on:
      - network-monitor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  network-monitor-data:
  network-monitor-logs:

networks:
  monitor-network:
    driver: bridge